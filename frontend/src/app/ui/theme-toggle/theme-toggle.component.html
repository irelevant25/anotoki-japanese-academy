<div class="segmented" role="radiogroup" [attr.aria-label]="label()" (keydown)="keydown($event)">
  @for (option of options(); track option.mode) {
    <button
      #option
      type="button"
      role="radio"
      class="segment"
      [attr.data-mode]="option.mode"
      [attr.aria-checked]="theme.mode() === option.mode"
      [attr.aria-label]="option.name"
      [title]="option.hint"
      [tabIndex]="theme.mode() === option.mode ? 0 : -1"
      (click)="theme.set(option.mode)"
    >
      <app-icon [name]="option.icon" [size]="16" />
    </button>
  }
</div>
