<main class="wrap signin" id="signin">
  <section class="panel">
    <h1><span class="mark" lang="ja">日本語</span>Japanese Academy</h1>
    <p>Sign in to study. Your kanji progress and your exam results are kept with your account.</p>
    <div class="actions">
      <button class="primary" type="button" id="signin-button" [disabled]="busy()" (click)="signIn()">Sign in</button>
    </div>
    <p class="err" role="alert">{{ error() }}</p>
  </section>
</main>
