<main class="wrap signin" id="signin">
  <section class="panel">
    <h1><span class="mark" lang="ja">日本語</span>Japanese Academy</h1>
    <p>{{ words().intro }}</p>
    <div class="actions">
      <button class="primary" type="button" id="signin-button" [disabled]="busy()" (click)="signIn()">{{ words().button }}</button>
    </div>
    <p class="err" role="alert">{{ error() }}</p>
  </section>
</main>
