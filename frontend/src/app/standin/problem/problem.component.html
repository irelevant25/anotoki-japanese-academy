<main class="wrap signin" id="signin">
  <anotoki-card>
    <div class="stack">
      <h1><span class="mark" lang="ja">日本語</span>Japanese Academy</h1>
      <anotoki-alert tone="danger" announce id="problem">{{ said() }}@if (detail(); as detail) {<span class="detail" lang="en">{{ detail }}</span>}</anotoki-alert>
      <div class="cluster">
        <button anotokiButton (click)="retry()">{{ tryAgain() }}</button>
      </div>
    </div>
  </anotoki-card>
</main>
