@if (changelog.version()) {
  <p class="foot-line">
    <span class="version" id="version">v{{ changelog.version() }}</span>
    <span class="sep" aria-hidden="true">·</span>
    <!-- the kit's quiet link button: 24 px to a mouse, 44 to a finger -->
    <button anotokiButton variant="link" size="sm" class="whats-new" id="whatsNew" [class.unseen]="changelog.unseen()" (click)="open()">
      <span class="label">{{ words().title }}@if (changelog.unseen()) {<span class="dot" [title]="words().unseen"></span>}</span>
    </button>
  </p>
}
<app-changelog-dialog />
