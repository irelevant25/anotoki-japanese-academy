@if (i18n.languages().length > 1) {
  <button
    #button
    type="button"
    class="switcher"
    id="langButton"
    aria-haspopup="menu"
    aria-controls="langmenu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="label()"
    [title]="label()"
    [attr.aria-busy]="switching() ? 'true' : null"
    (click)="toggle()"
  >
    {{ code() }}
  </button>
  @if (open()) {
    <div #menu class="menu" role="menu" id="langmenu" aria-labelledby="langButton" (keydown)="menuKeydown($event)">
      @for (offered of i18n.languages(); track offered.code) {
        <button
          type="button"
          role="menuitemradio"
          class="menu-item"
          [attr.lang]="offered.code"
          [attr.aria-checked]="offered.code === i18n.language()"
          (click)="choose(offered.code)"
        >
          <span class="menu-label">{{ offered.nativeName }}</span>
          @if (offered.code === i18n.language()) {
            <app-icon name="check" [size]="16" />
          }
        </button>
      }
      @if (failed()) {
        <p class="err" role="alert">{{ notLoaded() }}</p>
      }
    </div>
  }
}
