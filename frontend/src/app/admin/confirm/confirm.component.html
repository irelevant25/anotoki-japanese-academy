<dialog #dialog class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message" (cancel)="cancelled($event)" (keydown)="keys($event)">
  @if (words(); as w) {
    <h2 id="confirm-title">{{ w.title }}</h2>
    <p id="confirm-message">{{ w.message }}</p>
    <div class="actions">
      <button type="button" class="ghost" (click)="settle(false)">{{ w.cancel || 'Cancel' }}</button>
      <button type="button" class="primary" [class.danger]="w.danger" (click)="settle(true)">{{ w.confirm }}</button>
    </div>
  }
</dialog>
