<app-top-bar />

@switch (auth.state()) {
  @case ('ready') {
    <router-outlet />
  }
  @case ('visiting') {
    <!-- Nobody signed in, where the IAM does not require it: the app itself, for a visitor; a sign-in that came back without one is said above it. -->
    <app-sign-in-failed />
    <router-outlet />
  }
  @case ('signed-out') {
    <!-- On the way to the IAM (signInGuard) nothing is drawn; the card only after a failed sign-in, or a session that ended here. -->
    @if (auth.showSignIn()) {
      <app-sign-in />
    }
  }
  @case ('not-set-up') {
    <app-not-set-up />
  }
  @case ('problem') {
    <app-problem />
  }
}

<footer class="foot">
  <app-version />
</footer>
