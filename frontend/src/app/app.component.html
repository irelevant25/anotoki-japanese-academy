<!--
  The anotoki library's gate, the outermost of what the app draws: while the site is not ready - an update waiting, the
  database out of reach, not set up - its page stands alone, in a <main> of its own, with no bar and no footer
  (anotoki-lib 0.6.3, the owner's rule of 2026-10-18). Everything of the app's is its marked template
  (anotokiSitePages): the bar, the page and the footer, made only while the site is open - no page runs behind the
  library's page. The @switch stays inside it: a control-flow block is a template too, and only the marked one is the
  pages.
-->
<anotoki-site-gate>
    <ng-template anotokiSitePages>
        <app-top-bar />

        @switch (auth.state()) {
            @case ("ready") {
                <router-outlet />
            }
            @case ("visiting") {
                <!-- Nobody signed in, where the IAM does not require it: the app itself, for a visitor - or, when a sign-in of theirs came back without one, the library's screen that says why (its Back: the page) - but on a legal page, which is anybody's. -->
                @if (auth.signInError() && !legalPage()) {
                    <main class="wrap sign-in-failure" id="signInFailure"><anotoki-sign-in-failure-route /></main>
                } @else {
                    <router-outlet />
                }
            }
            @case ("signed-out") {
                <!-- A legal page: anybody's, signed in or not. A sign-in that came back without one: the library's screen. The session ended here: the Sign in card. Else on the way to the IAM (the library's guard), and nothing is drawn. -->
                @if (legalPage()) {
                    <router-outlet />
                } @else if (auth.signInError()) {
                    <main class="wrap sign-in-failure" id="signInFailure"><anotoki-sign-in-failure-route /></main>
                } @else if (auth.showSignIn()) {
                    <app-sign-in />
                }
            }
            @case ("problem") {
                <app-problem />
            }
        }

        <!--
      The family's footer (@anotoki/lib/footer), the build analyzer's: its top border, "v0.5.1 · What's new ·
      Feedback" ("Version 0.5.1" to a screen reader), then About · Support · Terms · Privacy · Contact. The version is the changelog's newest entry; What's new - once the
      changelog has come - opens the app's own news; Feedback, the library's form in the kit's dialog, only while the
      app itself is shown. No key pressed in it, nor in the form it opens, reaches the page: the reviews and the exam
      listen on `document`.
    -->
        <anotoki-site-footer [version]="changelog.version()" [whatsNew]="!!changelog.version()" (whatsNew)="news.open()" [feedback]="feedbackOffered()" (keydown)="$event.stopPropagation()" />
        <app-changelog-dialog #news />
    </ng-template>
</anotoki-site-gate>

<!--
  The kit's one question (ConfirmService: "Stop now?", "Sign out anyway?", the admin panel's "Delete…?") and the app's
  one notice (NoticeService: a report that would not open), drawn over the page - outside the gate, for its page and
  the app's alike. No key pressed in either reaches the page behind: Enter on Cancel never answers a card or hands a
  paper in.
-->
<anotoki-confirm-host (keydown)="$event.stopPropagation()" />
<app-notice-host />
