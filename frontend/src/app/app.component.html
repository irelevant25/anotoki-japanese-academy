<app-top-bar />

<!--
  The anotoki library's gate: while the site is not ready, its page in the place of all of this (and of the router's outlet).
  All of this is its marked template (anotokiSitePages), made only while the site is open: no page runs behind the
  library's page. The @switch stays inside it: a control-flow block is a template too, and only the marked one is the pages.
-->
<anotoki-site-gate>
  <ng-template anotokiSitePages>
    @switch (auth.state()) {
      @case ('ready') {
        <router-outlet />
      }
      @case ('visiting') {
        <!-- Nobody signed in, where the IAM does not require it: the app itself, for a visitor - or, when a sign-in of theirs came back without one, the library's screen that says why (its Back: the page). -->
        @if (auth.signInError()) {
          <main class="wrap sign-in-failure" id="signInFailure"><anotoki-sign-in-failure-route /></main>
        } @else {
          <router-outlet />
        }
      }
      @case ('signed-out') {
        <!-- A sign-in that came back without one: the library's screen. The session ended here: the Sign in card. Else on the way to the IAM (the library's guard), and nothing is drawn. -->
        @if (auth.signInError()) {
          <main class="wrap sign-in-failure" id="signInFailure"><anotoki-sign-in-failure-route /></main>
        } @else if (auth.showSignIn()) {
          <app-sign-in />
        }
      }
      @case ('problem') {
        <app-problem />
      }
    }
  </ng-template>
</anotoki-site-gate>

<footer class="foot">
  <app-version />
  <app-feedback-button />
</footer>

<!-- The kit's one question (ConfirmService: the admin panel's "Delete…?", "Leave without saving?"), drawn over the page. -->
<anotoki-confirm-host />
