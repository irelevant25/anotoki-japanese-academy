@if (notice()) {
  <section class="note visiting" id="visitorNotice">
    <p>{{ notice() }}</p>
    <button anotokiButton variant="primary" size="sm" id="visitorSignIn" [loading]="signInFlow.waiting()" (click)="signIn()">
      {{ 'signIn.button' | translate }}
    </button>
  </section>
}
@if (visitor.lost()) {
  <section class="note" id="visitorLost" role="status">
    <p>{{ 'visitor.lost' | translate }}</p>
    <button anotokiButton size="sm" (click)="visitor.lost.set(false)">{{ 'common.close' | translate }}</button>
  </section>
}
@if (moved(); as move) {
  <section class="note moved" id="visitorMoved" role="status">
    <p>
      {{ move.moved }}
      @if (move.kept) {
        <br />{{ move.kept }}
      }
    </p>
    <button anotokiButton size="sm" (click)="visitor.moved.set(null)">{{ 'common.close' | translate }}</button>
  </section>
}
