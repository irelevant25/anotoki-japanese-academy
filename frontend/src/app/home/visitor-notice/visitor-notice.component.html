@if (notice()) {
  <section class="note visiting" id="visitorNotice">
    <p>{{ notice() }}</p>
    <button
      type="button"
      class="primary sm"
      id="visitorSignIn"
      [disabled]="signInFlow.waiting()"
      [attr.aria-busy]="signInFlow.waiting()"
      (click)="signIn()"
    >
      @if (signInFlow.waiting()) {
        <span class="spinner" aria-hidden="true"></span>
      }
      {{ 'signIn.button' | translate }}
    </button>
  </section>
}
@if (visitor.lost()) {
  <section class="note" id="visitorLost" role="status">
    <p>{{ 'visitor.lost' | translate }}</p>
    <button type="button" class="ghost sm" (click)="visitor.lost.set(false)">{{ 'common.close' | translate }}</button>
  </section>
}
@if (moved(); as move) {
  <section class="note moved" id="visitorMoved" role="status">
    <p>
      {{ move.moved }}
      @if (move.kept) {
        <br />{{ move.kept }}
      }
    </p>
    <button type="button" class="ghost sm" (click)="visitor.moved.set(null)">{{ 'common.close' | translate }}</button>
  </section>
}
