@if (notice()) {
  <anotoki-alert id="visitorNotice">
    <p>{{ notice() }}</p>
    <div alertActions>
      <button anotokiButton variant="primary" id="visitorSignIn" [loading]="signInFlow.waiting()" (click)="signIn()">
        {{ 'signIn.button' | translate }}
      </button>
    </div>
  </anotoki-alert>
}
@if (visitor.lost()) {
  <anotoki-alert tone="warning" announce="polite" id="visitorLost">
    <p>{{ 'visitor.lost' | translate }}</p>
    <div alertActions>
      <button anotokiButton (click)="visitor.lost.set(false)">{{ 'common.close' | translate }}</button>
    </div>
  </anotoki-alert>
}
@if (moved(); as move) {
  <anotoki-alert tone="success" announce="polite" id="visitorMoved">
    <p>
      {{ move.moved }}
      @if (move.kept) {
        <br />{{ move.kept }}
      }
    </p>
    <div alertActions>
      <button anotokiButton (click)="visitor.moved.set(null)">{{ 'common.close' | translate }}</button>
    </div>
  </anotoki-alert>
}
