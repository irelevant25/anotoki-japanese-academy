<h1 class="page">{{ 'kanji.tab.browse' | translate }}</h1>
<anotoki-text-field
  [label]="'browse.search' | translate"
  hideLabel
  [placeholder]="'browse.search' | translate"
  [value]="query()"
  (valueChange)="query.set($event)"
/>
<div class="bfilters">
  <div class="chips">
    @for (t of typeChoices; track t[0]) {
      <button type="button" class="chip" [class.is-on]="type() === t[0]" (click)="type.set(t[0])">{{ t[1] | translate }}</button>
    }
  </div>
  <div class="chips">
    <button type="button" class="chip" [class.is-on]="!lesson()" (click)="lesson.set(null)">{{ 'browse.anyLesson' | translate }}</button>
    @for (L of kanji.lessons(); track L) {
      <button type="button" class="chip" [class.is-on]="lesson() === L" (click)="lesson.set(L)">L{{ L }}</button>
    }
  </div>
  <div class="chips">
    @for (s of statusChoices(); track s.id) {
      @if (s.key !== null) {
        <button type="button" class="chip" [class.is-on]="status() === s.id" (click)="status.set(s.id)">{{ s.key | translate }}</button>
      } @else {
        <button type="button" class="chip" [class.is-on]="status() === s.id" lang="en" (click)="status.set(s.id)">{{ s.name }}</button>
      }
    }
  </div>
</div>
<p class="small muted">{{ 'browse.count' | translatePlural: list().length }}</p>
<div class="bgrid">
  @for (it of shown(); track it.id) {
    <app-tile [item]="it" [withMeaning]="true" />
  }
</div>
