<div class="page">
  <anotoki-page-header [heading]="'kanji.tab.browse' | translate" />
  <div class="stack">
    <anotoki-text-field
      [label]="'browse.search' | translate"
      hideLabel
      [placeholder]="'browse.search' | translate"
      [value]="query()"
      (valueChange)="query.set($event)"
    />
    <div class="bfilters">
      <anotoki-segmented id="browseType" [label]="'practice.type' | translate" [options]="typeOptions()" [value]="type()" (valueChange)="type.set($event)" />
      <div class="cluster" id="browseLesson" role="group" [attr.aria-label]="'kanji.tab.lessons' | translate">
        <button anotokiButton size="sm" [variant]="!lesson() ? 'primary' : 'secondary'" [attr.aria-pressed]="!lesson()" (click)="lesson.set(null)">
          {{ 'browse.anyLesson' | translate }}
        </button>
        @for (L of kanji.lessons(); track L) {
          <button anotokiButton size="sm" [variant]="lesson() === L ? 'primary' : 'secondary'" [attr.aria-pressed]="lesson() === L" [attr.data-lesson]="L" (click)="lesson.set(L)">
            L{{ L }}
          </button>
        }
      </div>
      <div class="cluster" id="browseStage" role="group" [attr.aria-label]="'item.stage' | translate">
        @for (s of statusChoices(); track s.id) {
          <button
            anotokiButton
            size="sm"
            [variant]="status() === s.id ? 'primary' : 'secondary'"
            [attr.aria-pressed]="status() === s.id"
            [attr.data-stage]="s.id"
            [attr.lang]="s.key === null ? 'en' : null"
            (click)="status.set(s.id)"
          >
            {{ s.key !== null ? (s.key | translate) : s.name }}
          </button>
        }
      </div>
    </div>
    <p class="small muted">{{ 'browse.count' | translatePlural: list().length }}</p>
    <div class="bgrid">
      @for (it of shown(); track it.id) {
        <app-tile [item]="it" [withMeaning]="true" />
      }
    </div>
  </div>
</div>
