@if (due.length) {
  <app-session mode="review" [items]="due" (done)="finished($event)" />
} @else {
  <h1 class="page">Reviews</h1>
  <section class="panel empty">
    <p>No reviews due right now.</p>
    @if (next()) {
      <p class="muted">{{ next() }}</p>
    }
    <p class="muted">You can still drill anything you have learned in Practice — it does not touch the schedule.</p>
    <div class="actions">
      <a class="btn primary" routerLink="/kanji/practice">Practice</a>
      <a class="btn ghost" routerLink="/kanji/lessons">Lessons</a>
    </div>
  </section>
}
