@if (due.length) {
  <app-session mode="review" [items]="due" (done)="finished($event)" />
} @else {
  <h1 class="page">{{ 'kanji.tab.reviews' | translate }}</h1>
  <section class="panel empty">
    <p>{{ 'reviews.noneDue' | translate }}</p>
    @if (next()) {
      <p class="muted">{{ next() }}</p>
    }
    <p class="muted">{{ 'reviews.practiceHint' | translate }}</p>
    <div class="actions">
      <a class="btn primary" routerLink="/kanji/practice">{{ 'kanji.tab.practice' | translate }}</a>
      <a class="btn ghost" routerLink="/kanji/lessons">{{ 'kanji.tab.lessons' | translate }}</a>
    </div>
  </section>
}
