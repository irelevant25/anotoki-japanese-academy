@if (item().type === "kanji") {
    <div class="readings">
        <div class="rd">
            <span class="rk">On'yomi</span>
            <span class="rv" lang="ja">{{ join(item().on) }}</span>
        </div>
        <div class="rd">
            <span class="rk">Kun'yomi</span>
            <span class="rv" lang="ja">{{ join(item().kun) }}</span>
        </div>
        @if (extra().length) {
            <div class="rd">
                <span class="rk">{{ "item.alsoAccepted" | translate }}</span>
                <span class="rv" lang="ja">{{ extra().join("、") }}</span>
            </div>
        }
    </div>
} @else {
    <div class="readings">
        <div class="rd">
            <span class="rk">{{ "kanji.reading" | translate }}</span>
            <span class="rv" lang="ja">{{ wordReadings() }}</span>
            @if (item().audio) {
                <button anotokiButton size="sm" (click)="listen()">{{ "kanji.listen" | translate }}</button>
            }
        </div>
    </div>
}
