<section class="dsec notes">
  @if (title()) {
    <h3>{{ title() }}</h3>
  }
  @for (field of fields; track field.part) {
    <label class="field">
      <span class="lbl">{{ field.label }} <span class="small muted">{{ field.status() }}</span></span>
      <textarea
        rows="2"
        [placeholder]="field.placeholder"
        [value]="field.value"
        (input)="typed(field, $any($event.target).value)"
        (blur)="left(field)"
        (keydown)="keydown($event)"
      ></textarea>
    </label>
  }
</section>
