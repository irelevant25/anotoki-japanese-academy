<section class="dsec notes">
  @if (title(); as heading) {
    <h3>{{ heading | translate }}</h3>
  }
  @for (field of fields; track field.part) {
    <label class="field">
      <span class="lbl">{{ field.label | translate }} <span class="small muted">{{ said(field.status()) }}</span></span>
      <textarea
        rows="2"
        [placeholder]="field.placeholder | translate"
        [value]="field.value"
        (input)="typed(field, $any($event.target).value)"
        (blur)="left(field)"
        (keydown)="keydown($event)"
      ></textarea>
    </label>
  }
</section>
